# Allow list for actions/dependency-review-action. The identifiers must match
# .github/license-allowlist.txt exactly; license_check.py checks that.
#
# This action only looks at dependency changes in a pull request. It does not
# fail when GitHub cannot identify a license. The full-tree job in
# licenses.yml is the check that fails closed on copyleft and on unknown
# licenses, including packages already in the tree.
#
# vulnerability-check is off so this workflow stays a license gate.

vulnerability-check: false
license-check: true
fail-on-scopes:
  - runtime
  - development
  - unknown
allow-licenses:
  - 0BSD
  - AFL-3.0
  - Apache-2.0
  - Artistic-2.0
  - BlueOak-1.0.0
  - BSD-1-Clause
  - BSD-2-Clause
  - BSD-2-Clause-Patent
  - BSD-3-Clause
  - BSD-3-Clause-Attribution
  - BSL-1.0
  - CC-BY-3.0
  - CC-BY-4.0
  - CC0-1.0
  - curl
  - HPND
  - ISC
  - libpng-2.0
  - MIT
  - MIT-0
  - MS-PL
  - NCSA
  - NTP
  - PostgreSQL
  - PSF-2.0
  - Python-2.0
  - Unicode-3.0
  - Unicode-DFS-2016
  - Unlicense
  - WTFPL
  - X11
  - Zlib
