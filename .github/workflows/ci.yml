# Run the checks that were already worth running.
#
# The suite, the linter and the type-checking build all existed before this file; nothing
# ran them except a person remembering to. The branch workflow is feature branch -> PR ->
# merge, so the place a broken commit should be caught is the PR, not the deploy.
#
# Versions here track the Dockerfile (python:3.12-slim, node:20-alpine) on purpose: CI
# should fail on what production would fail on, not on a newer interpreter that happens to
# be on the runner.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # No secrets, and none needed. `.env` is gitignored so the runner has none, and
      # tests/conftest.py disables the dotenv read anyway; document extraction sits behind
      # the analyzer seam and runs against synthetic fixtures. If a test ever starts
      # needing a credential, it should fail here loudly rather than be given one.
      - name: Test
        run: pytest -q

  web:
    name: Web — oxlint + tsc build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the type check as much as it
      # is the bundle. The VITE_* variables are deliberately unset: they are baked in at
      # image build time and nothing here needs their values to prove the app compiles.
      - name: Build
        run: npm run build
