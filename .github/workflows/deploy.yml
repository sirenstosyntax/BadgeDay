# Deploy BadgeDay from GitHub: apply pending database migrations, then ship the image.
#
# The same two steps a person ran from a laptop (scripts/apply_migrations.py, then
# deploy/azure-deploy.sh), in the order that matters: a release can read a table that only
# its migration creates, so the database goes first and a failed migration stops the
# deploy. Run by hand only (Actions -> Deploy -> Run workflow), and only from main.
#
# Secrets come from deploy/setup_github_deploy.sh, run once on the laptop that deployed
# before: BADGEDAY_ENV (the .env), BADGEDAY_WEB_ENV (web/.env.local), AZURE_CREDENTIALS
# (a service principal scoped to the BadgeDay resource group).

name: Deploy

on:
  workflow_dispatch:

# Two deploys at once would race on the same Container Apps; queue the second.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate + deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # Both scripts read files, not variables, so write the files the laptop had.
      - name: Write config
        env:
          BADGEDAY_ENV: ${{ secrets.BADGEDAY_ENV }}
          BADGEDAY_WEB_ENV: ${{ secrets.BADGEDAY_WEB_ENV }}
        run: |
          if [ -z "$BADGEDAY_ENV" ] || [ -z "$BADGEDAY_WEB_ENV" ]; then
            echo "::error::BADGEDAY_ENV or BADGEDAY_WEB_ENV is not set. Run deploy/setup_github_deploy.sh once."
            exit 1
          fi
          umask 077
          printf '%s\n' "$BADGEDAY_ENV" > .env
          printf '%s\n' "$BADGEDAY_WEB_ENV" > web/.env.local

      - name: Database migrations
        run: |
          python scripts/apply_migrations.py
          python scripts/apply_migrations.py --status

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ASSUME_YES skips the script's "create/update these resources?" prompt: pressing
      # Run workflow is that yes.
      - name: Deploy
        env:
          ASSUME_YES: "1"
        run: ./deploy/azure-deploy.sh

      - name: Remove config
        if: always()
        run: rm -f .env web/.env.local
