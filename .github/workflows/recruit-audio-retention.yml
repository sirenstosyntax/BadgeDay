# Monthly proof that recruit-audio does not keep recordings.
#
# A file older than a day means a delete was missed. The job fails. It needs
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository secrets. A missing
# secret is also a failure — the check must not pass by having nothing to call.
#
# This workflow does not apply SQL and does not write to the bucket.

name: Recruit audio retention

on:
  schedule:
    # 15:17 UTC on the 1st. Off the hour so it does not pile onto other crons.
    - cron: "17 15 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    name: No recruit-audio file older than a day
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Check the bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/recruit_audio_retention_check.py
