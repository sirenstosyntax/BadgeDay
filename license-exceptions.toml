# Reviewed exceptions to LICENSE-POLICY.md.
#
# A package whose license is outside .github/license-allowlist.txt ships only
# when a row below records a deliberate review. CI fails on copyleft and on
# unknown licenses until that review exists.
#
# Required fields on every [[exception]] row:
#   ecosystem    pypi, npm, or gem
#   package      distribution name (npm scopes included)
#   license      canonical SPDX expression printed by .github/license_check.py
#   reason       what was reviewed and why this package may ship
#   approved_by  person who accepted the obligation
#   date         YYYY-MM-DD
#   version      pins the review to that release; a newer release is not covered
#
# A blank field does not approve the package. A row that matches nothing in
# the tree fails CI, so a removed dependency takes its exception with it.
# The Ruby license is not on the allow list. Do not add it there.

# --- pypi: Mozilla CA bundle, used unmodified ---

[[exception]]
ecosystem = "pypi"
package = "certifi"
license = "MPL-2.0"
reason = "Mozilla CA bundle used unmodified. MPL-2.0. No permissive republish of this bundle."
approved_by = "Grant"
date = "2026-10-22"
version = "2026.10.19"

