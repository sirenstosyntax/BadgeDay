[project]
name = "badgeday"
version = "0.1.0"
description = "Cited practice questions generated from a firefighter promotional reading list."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "anthropic>=0.116",
    "azure-ai-documentintelligence>=1.0",
    "supabase>=2.10",
    "stripe>=11.0",
    # App-store billing. Both are here to verify signatures rather than to call an API:
    # google-auth checks the OIDC token on a Pub/Sub push, and app-store-server-library is
    # Apple's own implementation of the JWS certificate-chain check. Hand-rolling either is
    # how you end up with a signature check that verifies no signature.
    "google-auth>=2.35",
    "google-api-python-client>=2.150",
    "app-store-server-library>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
badgeday-ingest = "app.ingest.cli:main"
badgeday-critique = "app.critique.cli:main"
badgeday-worker = "app.worker.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# `supabase/` at the repo root holds the SQL migrations, not a Python package. Ruff
# infers first-party names from top-level directories, so without this it files the
# Supabase SDK alongside our own imports and then fights the fix on every run.
known-third-party = ["supabase"]
