<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover so the app can paint into the notch and home-indicator areas
         once it is running as an installed app rather than a browser tab. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Practice the oral board out loud, or study questions from your reading list." />

    <!-- Installable, and the prerequisite for the Play wrapper: a Trusted Web Activity is
         a PWA in a shell, and Bubblewrap reads this manifest to generate the Android
         project. The icons it names do not exist yet — see web/public/icons/README.md. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#171E26" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="BadgeDay" />

    <title>BadgeDay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
